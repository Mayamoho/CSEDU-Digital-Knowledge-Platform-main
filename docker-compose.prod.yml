# ============================================================
# CSEDU Digital Knowledge Platform — Production docker-compose
# ONLY port 8080 (nginx) is exposed to the host. Everything else
# (api, rag, postgres, redis, minio, workers) lives on the internal
# Docker network and is reachable only from inside the container
# group — this keeps the host port budget tiny for shared VMs.
#
# Port map:
#   8080 → nginx   (entry point: web app + reverse-proxied /api/v1)
#
# To debug a service, exec into it from inside Docker:
#   docker compose exec postgres psql -U csedu_user -d csedu_platform
#   docker compose exec redis redis-cli
#   docker compose exec minio mc ls local/
#
# Available host ports on this VM: 8080-8088 (8089/8090 taken).
# This stack consumes ONE of them: 8080.
# ============================================================

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: csedu_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-csedu_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_in_prod}
      POSTGRES_DB: ${DB_NAME:-csedu_platform}
    # No host port — internal only
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./infra/db/migrate_project_fixes.sql:/docker-entrypoint-initdb.d/migrate_project_fixes.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-csedu_user} -d ${DB_NAME:-csedu_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: csedu_redis
    # No host port — internal only
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: csedu_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-changeme_in_prod}
    # No host ports — internal only (API on 9000, console on 9001)
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: csedu_nginx
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - api
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: csedu_frontend
    # No host port — Nginx reaches it on internal Docker network
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      # NOTE: We deliberately do NOT set NEXT_PUBLIC_API_URL here.
      # The frontend's client-side code uses a SAME-ORIGIN relative
      # URL (/api/v1) so it works regardless of which public host
      # the browser is hitting. Nginx on port 8080 then reverse-
      # proxies /api/v1/* to the api container.
      # Internal Docker network for server-side rendering (SSR):
      - INTERNAL_API_URL=http://api:8080/api/v1
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: csedu_api
    # No host port — Nginx reverse-proxies /api/v1/* here
    expose:
      - "8080"
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - MINIO_ENDPOINT=minio:9000
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────────────
  # rag DISABLED for low-RAM deployment (4 GiB VM).
  # Tagged with profile: ["ai"] so it's skipped unless you opt in:
  #   docker compose --profile ai up -d rag
  # When disabled, AI chat endpoints will return errors but the rest
  # of the app (library, catalog, projects, fines) still works.
  # ──────────────────────────────────────────────────────────────────
  rag:
    build:
      context: ./rag
      dockerfile: Dockerfile
    container_name: csedu_rag
    profiles: ["ai"]
    expose:
      - "8001"
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────────────
  # ingestion-worker DISABLED for low-RAM deployment (4 GiB VM).
  # Opt in with: docker compose --profile ai up -d ingestion-worker
  # ──────────────────────────────────────────────────────────────────
  ingestion-worker:
    build:
      context: ./api
      dockerfile: Dockerfile.worker
    container_name: csedu_ingestion_worker
    profiles: ["ai"]
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  fine-worker:
    build:
      context: ./api
      dockerfile: Dockerfile.fineworker
    container_name: csedu_fine_worker
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus
    container_name: csedu_prometheus
    # No host port — debug via `docker compose exec prometheus ...` if needed
    expose:
      - "9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    profiles:
      - dev
    restart: unless-stopped

  grafana:
    image: grafana/grafana
    container_name: csedu_grafana
    # No host port — debug via `docker compose exec grafana ...` if needed
    expose:
      - "3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    profiles:
      - dev
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  grafana_data: