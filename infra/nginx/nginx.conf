upstream frontend { server frontend:3000; }
upstream api      { server api:8080;     }

# ── Rate limiting ────────────────────────────────────────────────────────────
# Keyed on client IP. Limits are deliberately generous enough for a live demo
# but tight enough to stop credential brute-forcing and LLM quota abuse, which
# are the two endpoints where an attacker actually gains something.
#   auth  — login/register/magic-link: 20 requests/minute
#   ai    — RAG queries burn Groq free-tier quota: 30 requests/minute
#   api   — everything else: 20 requests/second
limit_req_zone $binary_remote_addr zone=authzone:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=aizone:10m   rate=30r/m;
limit_req_zone $binary_remote_addr zone=apizone:10m  rate=20r/s;
limit_req_status 429;
limit_conn_zone $binary_remote_addr zone=connzone:10m;

server {
    listen 80;
    server_name _;

    client_max_body_size 55m;

    # Never advertise the exact nginx build.
    server_tokens off;

    # ── Security headers (applied to every response, including errors) ───────
    # HSTS is set by the host-level nginx that terminates TLS, not here.
    add_header X-Content-Type-Options    "nosniff"                     always;
    add_header X-Frame-Options           "SAMEORIGIN"                  always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin"                always;

    # Max 50 concurrent connections per IP — cheap protection against a
    # single client exhausting worker slots on a 4 GiB shared VM.
    limit_conn connzone 50;

    location /_next/static/ {
        proxy_pass http://frontend;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Credential endpoints — the strictest bucket. `nodelay` lets a genuine
    # user retry a typo immediately; sustained brute force still gets 429.
    location ~ ^/api/v1/auth/(login|register|refresh|magic|change-password|forgot) {
        limit_req             zone=authzone burst=10 nodelay;
        proxy_pass            http://api;
        proxy_read_timeout    15s;
        proxy_connect_timeout 5s;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_set_header      Authorization     $http_authorization;
    }

    # AI routes — longer timeout (Groq can take ~10s) and buffering disabled so
    # Server-Sent Events reach the browser token by token instead of arriving
    # in one chunk when the response completes.
    location /api/v1/ai/ {
        limit_req             zone=aizone burst=10 nodelay;
        proxy_pass            http://api;
        proxy_read_timeout    60s;
        proxy_connect_timeout 5s;
        proxy_buffering       off;
        proxy_cache           off;
        proxy_http_version    1.1;
        proxy_set_header      Connection        "";
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_set_header      Authorization     $http_authorization;
        add_header            X-Accel-Buffering "no" always;
    }

    location /api/ {
        limit_req             zone=apizone burst=40 nodelay;
        proxy_pass            http://api;
        proxy_read_timeout    15s;
        proxy_connect_timeout 5s;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_set_header      Authorization     $http_authorization;
    }

    location / {
        proxy_pass            http://frontend;
        proxy_read_timeout    15s;
        proxy_connect_timeout 5s;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_http_version    1.1;
        proxy_set_header      Upgrade           $http_upgrade;
        proxy_set_header      Connection        "upgrade";
    }
}
