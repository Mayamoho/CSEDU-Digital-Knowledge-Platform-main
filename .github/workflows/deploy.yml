name: Deploy to VM

# Images are built on GitHub's runners (fast, plenty of RAM) and pushed to GHCR.
# The 4 GB VM then only pulls + restarts — it never compiles anything, which is
# what made manual deploys slow.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: mayamoho

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: frontend
            context: .
            dockerfile: Dockerfile
          - name: api
            context: ./api
            dockerfile: ./api/Dockerfile
          - name: rag
            context: ./rag
            dockerfile: ./rag/Dockerfile
          - name: fine-worker
            context: ./api
            dockerfile: ./api/Dockerfile.fineworker
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/csedu-${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/csedu-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Pull new images and restart the stack
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -e
            cd ${{ secrets.VM_APP_DIR }}

            git fetch origin
            git reset --hard origin/main

            export IMAGE_TAG=${{ github.sha }}
            COMPOSE="docker compose -f docker-compose.prod.yml -f docker-compose.ghcr.yml"

            # Only needed while the GHCR packages are private. Make them public
            # in GitHub → Packages → Package settings and this becomes a no-op.
            if [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
              echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            fi

            # Idempotent DB migrations (same ones quick-update.sh applies)
            for f in infra/db/migrations/*.sql; do
              echo "migration: $f"
              $COMPOSE exec -T postgres psql -U csedu_user -d csedu_platform < "$f" || true
            done

            $COMPOSE pull frontend api rag fine-worker
            $COMPOSE up -d nginx frontend api rag fine-worker

            # nginx caches upstream container IPs; restart so it re-resolves them
            $COMPOSE restart nginx

            docker image prune -f
            $COMPOSE ps

      - name: Smoke check
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://${{ secrets.VM_HOST }}:8080/" || true)
            if [ "$code" = "200" ]; then echo "site up"; exit 0; fi
            sleep 5
          done
          echo "site did not return 200 after restart"; exit 1
