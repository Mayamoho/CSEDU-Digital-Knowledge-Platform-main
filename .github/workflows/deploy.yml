name: Deploy to VM

# Images are built on GitHub's runners (fast, plenty of RAM) and pushed to GHCR.
# The 4 GB VM then only pulls + restarts — it never compiles anything, which is
# what made manual deploys slow.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: mayamoho

jobs:
  # Quality gate. Nothing is built or deployed unless static analysis and the
  # Go unit tests pass, so a broken main never reaches the VM.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: api/go.sum

      - name: go vet (static analysis)
        working-directory: ./api
        run: go vet ./...

      - name: go test (unit)
        working-directory: ./api
        run: go test ./... -covermode=atomic -coverprofile=coverage.out

      - name: Coverage summary
        working-directory: ./api
        run: |
          go tool cover -func=coverage.out | tail -20
          echo "### Go coverage" >> $GITHUB_STEP_SUMMARY
          go tool cover -func=coverage.out | tail -1 >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: api/coverage.out

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: RAG service tests
        working-directory: ./rag
        run: |
          pip install --quiet pytest httpx pydantic-settings
          pytest -q test_keyword_extractor.py

      - name: Frontend typecheck
        run: |
          npm ci --prefer-offline --no-audit --legacy-peer-deps
          npx tsc --noEmit

  # Integration gate (SDD §8.2). Runs the handlers against a real PostgreSQL,
  # which is where this codebase's actual bugs have lived: uuid/text casts,
  # array parameter inference, cascade behaviour. Blocks the deploy on failure.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: csedu_user
          POSTGRES_PASSWORD: csedu_test_password
          POSTGRES_DB: csedu_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U csedu_user -d csedu_platform"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: api/go.sum

      - name: Apply schema and migrations
        env:
          PGPASSWORD: csedu_test_password
        run: |
          psql -h localhost -U csedu_user -d csedu_platform -v ON_ERROR_STOP=1 -q -f infra/db/init.sql
          # Same semantics as scripts/deploy-remote.sh: each migration is
          # idempotent, and one that no longer applies to a fresh init.sql is
          # skipped rather than failing the run. The tests are the real gate —
          # if a migration that matters did not land, they fail.
          for f in infra/db/migrations/*.sql; do
            if psql -h localhost -U csedu_user -d csedu_platform -v ON_ERROR_STOP=1 -q -f "$f" >/dev/null 2>&1; then
              echo "    ok      $f"
            else
              echo "    skipped $f"
            fi
          done

      - name: go test (integration)
        working-directory: ./api
        env:
          TEST_DATABASE_URL: postgres://csedu_user:csedu_test_password@localhost:5432/csedu_platform
          JWT_SECRET: integration_test_secret_at_least_32_characters_long
        run: go test -tags=integration ./tests/... -v

  build:
    needs: [test, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: frontend
            context: .
            dockerfile: Dockerfile
          - name: api
            context: ./api
            dockerfile: ./api/Dockerfile
          - name: rag
            context: ./rag
            dockerfile: ./rag/Dockerfile
          - name: fine-worker
            context: ./api
            dockerfile: ./api/Dockerfile.fineworker
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/csedu-${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/csedu-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Pull new images and restart the stack
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          # Key auth is preferred; VM_PASSWORD is the fallback for a VM that
          # only has password login. Set exactly one of them as a repo secret.
          key: ${{ secrets.VM_SSH_KEY }}
          password: ${{ secrets.VM_PASSWORD }}
          port: ${{ secrets.VM_PORT || 22 }}
          script_stop: true
          command_timeout: 30m
          # One command only. appleboy/ssh-action rewrites a multi-line script
          # line by line and splices an exit-code check between statements,
          # which mangles loops and redirects — that is what hung the previous
          # deploy on `psql < file`. All the real logic lives in the committed
          # script, which runs under a normal bash on the VM.
          script: |
            cd ${{ secrets.VM_APP_DIR || '~/csedu-platform' }} && git fetch origin && git reset --hard origin/main && bash scripts/deploy-remote.sh ${{ github.sha }}

      - name: Smoke check
        run: |
          host="${{ secrets.VM_HOST }}"
          for i in $(seq 1 30); do
            site=$(curl -s -o /dev/null -w '%{http_code}' "http://$host:8080/" || true)
            api=$(curl -s -o /dev/null -w '%{http_code}' "http://$host:8080/api/v1/health" || true)
            echo "attempt $i: site=$site api=$api"
            if [ "$site" = "200" ] && [ "$api" = "200" ]; then
              echo "frontend and API are both healthy"
              exit 0
            fi
            sleep 5
          done
          echo "stack did not become healthy after restart"; exit 1
